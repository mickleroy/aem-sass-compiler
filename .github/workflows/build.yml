name: Build

on: 
  workflow_dispatch:
  push:
      branches:
        - feat/**

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v1
      with:
        java-version: '8'
        cache: maven
    - name: Build with Maven
      run: mvn clean package
